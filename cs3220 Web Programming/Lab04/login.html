<!DOCTYPE html>
<html>
    <head>
        <title>Login</title>
        <meta charset="utf-8" />
        <meta name='viewport' content="width=device-width, initial-scale=1.0" />
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
		<link rel="stylesheet" type="text/css" href="../assets/css/lab4.css">
    </head>

    <body>
        <div id="login" class="col-lg-3 rounded-4 position-absolute top-50 start-50 translate-middle p-5 text-center">
            <h1 class="text-white">LOGIN</h1>
            <p class="text-secondary">Please enter your login and password!</p>
            <br />
            <form action="./articles.html" method="post">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" name="email" required>
                    <label for="username" class="form-label text-light">Email</label>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="password" name="password" required>
                    <label for="password" class="form-label text-light">Password</label>
                </div>
                <p><a href="#" class="link-secondary">Forgot password?</a></p><br />
                <button type="submit" class="btn btn-outline-light text-center">Login</button><br />
                <br />
                <h5 class="text-light"><i class="bi bi-facebook"></i>          <i class="bi bi-twitter-x"></i>          <i class="bi bi-google"></i></h5>
                <br />
                <br />
                <p class="text-light">Don't have an account? <a href="#" class="link-secondary">Sign up</a></p>
            </form>
        </div>
    </body>
</html>
